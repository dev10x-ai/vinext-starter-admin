# Cloudflare Worker — vinext App Router SSR + mock API (/api/*)
# + Docusaurus docs under /docs/* (copied into dist/client/docs by `make docs-build`).
#
# Required GitHub secrets (do not commit tokens):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name = "vinext-starter-admin"
main = "worker/index.ts"
compatibility_date = "2025-07-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[[routes]]
pattern = "vinext-starter-admin.dev10x.ai"
custom_domain = true

# Optional: proxy `/api/*` to a real backend (leave unset to use the in-worker mock).
# Prefer a Worker secret in production: `wrangler secret put API_PROXY_TARGET`
# [vars]
# API_PROXY_TARGET = "https://api.example.com"

[assets]
# vinext emits browser assets to dist/client; docs are merged at dist/client/docs.
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"
html_handling = "auto-trailing-slash"
