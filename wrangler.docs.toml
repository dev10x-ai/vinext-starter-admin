# Cloudflare Worker — serves the Docusaurus site from website/build.
# Deployed by .github/workflows/deploy.yml (tags) and preview.yml (branches).
#
# Required GitHub secrets (do not commit tokens):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name = "vinext-starter-admin-docs"
compatibility_date = "2025-07-12"
workers_dev = true
preview_urls = true

[[routes]]
pattern = "vinext-starter-admin-docs.dev10x.ai"
custom_domain = true

[assets]
directory = "./website/build"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
