# Cloudflare Worker — Vite SPA (dist/) + in-Worker mock API (/api/*).
# Deployed by .github/workflows/deploy.yml (tags → production).
#
# Required GitHub secrets (do not commit tokens):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name = "vinext-starter-admin"
main = "worker/index.ts"
compatibility_date = "2025-07-12"
workers_dev = true
preview_urls = true

# Production custom domain (zone: dev10x.ai on this Cloudflare account).
# Requires the zone's nameservers to be active at Cloudflare for public DNS.
[[routes]]
pattern = "vinext-starter-admin.dev10x.ai"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Run the Worker first for API; static SPA assets for everything else.
run_worker_first = ["/api", "/api/*"]
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
