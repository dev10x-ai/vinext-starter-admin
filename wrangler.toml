# Cloudflare Worker — serves the Vite SPA from dist/ as static assets.
# Deployed by .github/workflows/deploy.yml (tags → production) and preview.yml (branches).
#
# Required GitHub secrets (do not commit tokens):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name = "vinext-starter-admin"
compatibility_date = "2025-07-12"
workers_dev = true
preview_urls = true

# Production custom domain (zone: dev10x.ai on this Cloudflare account).
# Requires the zone's nameservers to be active at Cloudflare for public DNS.
[[routes]]
pattern = "vinext-starter-admin.dev10x.ai"
custom_domain = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
