# Cloudflare Worker — serves the Vite SPA from dist/ as static assets.
# Deployed by .github/workflows/deploy.yml via cloudflare/wrangler-action.
#
# Required GitHub secrets (do not commit tokens):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name = "vinext-starter-admin"
compatibility_date = "2025-07-12"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto"
