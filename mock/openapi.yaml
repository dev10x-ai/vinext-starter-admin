components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource id (string in the mock DB)

  schemas:
    SearchResult:
      type: object
      required: [type, id, title, url]
      properties:
        type:
          type: string
          enum: [user, tenant, setting]
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        url:
          type: string
          description: Absolute app path to navigate to (e.g. `/app/settings/ai`)

    SearchResponse:
      type: object
      required: [query, results]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'

    ErrorMessage:
      type: object
      properties:
        message:
          type: string
      required: [message]

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    OtpVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          example: '123456'

    SignupRequest:
      type: object
      required: [name, organizationName, email, password]
      properties:
        name:
          type: string
        organizationName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    ChangePasswordRequest:
      type: object
      required: [email, currentPassword, newPassword]
      properties:
        email:
          type: string
          format: email
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          description: Present in DB responses from json-server; stripped on auth responses.
        role:
          type: string
        tenantId:
          type: string
        status:
          type: string
          enum: [active, inactive]
        twoFactorEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserWrite:
      type: object
      required: [name, email, password, role, tenantId, status]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
        tenantId:
          type: string
        status:
          type: string
        twoFactorEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserPatch:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        status:
          type: string
        role:
          type: string
        twoFactorEnabled:
          type: boolean

    LoginResponse:
      type: object
      properties:
        requiresOtp:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          nullable: true

    AuthSessionResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string

    OtpRequestResponse:
      type: object
      properties:
        message:
          type: string
        email:
          type: string
        demoOtp:
          type: string
        purpose:
          type: string

    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          enum: [starter, growth, enterprise]
        status:
          type: string
          enum: [active, suspended]
        usersCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    TenantWrite:
      type: object
      required: [name, slug, plan, status]
      properties:
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
        status:
          type: string
        usersCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    TenantPatch:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        plan:
          type: string
        status:
          type: string
        usersCount:
          type: integer

    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    RoleWrite:
      type: object
      required: [name, key]
      properties:
        name:
          type: string
        key:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    Permission:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        label:
          type: string
        group:
          type: string

    MenuItem:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        path:
          type: string
          nullable: true
        icon:
          type: string
        parentId:
          type: string
          nullable: true
        order:
          type: integer
        enabled:
          type: boolean

    MenuItemWrite:
      type: object
      required: [label, order, enabled]
      properties:
        label:
          type: string
        path:
          type: string
          nullable: true
        icon:
          type: string
        parentId:
          type: string
          nullable: true
        order:
          type: integer
        enabled:
          type: boolean

    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationWrite:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationPatch:
      type: object
      properties:
        read:
          type: boolean
        title:
          type: string
        body:
          type: string

    SettingsDocument:
      type: object
      description: Shape varies by id/category (ai, email, thirdparty, logs)
      properties:
        id:
          type: string
        category:
          type: string
        enabled:
          type: boolean
      additionalProperties: true

    DashboardStat:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: number
        delta:
          type: number
        series:
          type: array
          items:
            type: number
