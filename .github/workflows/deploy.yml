# Production deploy: vinext App Router Worker + docs (dist/client/docs) → single Cloudflare Worker.
# Triggers only on version tags (and manual dispatch). Branch pushes use preview.yml.
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install docs dependencies
        run: npm ci --prefix website

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        run: make test

      - name: Build admin (Workers SSR bundle)
        run: make build

      - name: Build docs into dist/client/docs
        run: make docs-build

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Workers (production)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: dist

      - name: Deploy admin Worker (includes /docs)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          # Generated by @cloudflare/vite-plugin during `make build` (see dist/server/wrangler.json).
          command: deploy --config dist/server/wrangler.json
