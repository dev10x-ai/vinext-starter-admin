# Production deploy: admin SPA + Docusaurus docs → Cloudflare Workers custom domains.
# Triggers only on version tags (and manual dispatch). Branch pushes use preview.yml.
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install docs dependencies
        run: npm ci --prefix website

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        run: make test

      - name: Build admin
        run: make build

      - name: Build docs
        run: make docs-build

      - name: Upload admin dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist
          retention-days: 1

      - name: Upload docs build
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: website/build
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Workers (production)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download admin dist
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: dist

      - name: Download docs build
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: website/build

      - name: Deploy admin Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Keep in sync with Preview; action defaults to Wrangler 3.x without a local dep.
          wranglerVersion: '4'
          command: deploy

      - name: Deploy docs Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config wrangler.docs.toml
