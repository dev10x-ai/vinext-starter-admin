# Preview deploy: upload Worker versions for admin + docs (no production traffic).
# Runs on pushes to branches. Production domains update only on tag deploys.
name: Preview

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and upload Workers previews
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install docs dependencies
        run: npm ci --prefix website

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        run: make test

      - name: Build admin
        run: make build

      - name: Build docs
        run: make docs-build

      - name: Sanitize preview alias
        id: alias
        run: |
          RAW="${GITHUB_REF_NAME}"
          ALIAS="$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' | cut -c1-63)"
          if [ -z "$ALIAS" ]; then
            ALIAS="branch"
          fi
          echo "value=${ALIAS}" >> "$GITHUB_OUTPUT"
          echo "Preview alias: ${ALIAS}"

      - name: Upload admin preview version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.alias.outputs.value }}

      - name: Upload docs preview version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --config wrangler.docs.toml --preview-alias ${{ steps.alias.outputs.value }}

      - name: Preview URL hint
        run: |
          {
            echo "## Cloudflare preview"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Preview alias: \`${{ steps.alias.outputs.value }}\`"
            echo "- Admin pattern: \`https://<alias>-vinext-starter-admin.<account-subdomain>.workers.dev\`"
            echo "- Docs pattern: \`https://<alias>-vinext-starter-admin-docs.<account-subdomain>.workers.dev\`"
            echo ""
            echo "Exact URLs are printed in the Wrangler step logs."
            echo "This does **not** update \`vinext-starter-admin.dev10x.ai\` or \`vinext-starter-admin-docs.dev10x.ai\`."
          } >> "$GITHUB_STEP_SUMMARY"
